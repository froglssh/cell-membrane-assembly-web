<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>細胞膜拼裝站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#FAF7F1; --line:#E0D8C8; --line-soft:#ECE6DA;
  --ink:#2A2118; --ink-2:#5A4C3C; --ink-3:#877865;
  --accent:#0E7C74; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB;
  --g1:#C9612A; --g1-soft:#FBE7DA;
  --g3:#4E8A2E; --g3-soft:#E4F0DA;
  --ok:#227A5C; --ok-soft:#DCF0E7; --no:#B8402F; --no-soft:#FBE5E0; --warn:#9A6A12; --warn-soft:#FAEFD8;
  --shadow:0 1px 2px rgba(42,33,24,.06),0 8px 24px -12px rgba(42,33,24,.2);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC","Hiragino Sans",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#17140F; --surface:#221D16; --surface-2:#2A241C; --line:#3E3528; --line-soft:#322B21;
  --ink:#F1EADF; --ink-2:#CDBFAC; --ink-3:#9D8F7C;
  --accent:#39B3A6; --accent-ink:#06231F; --accent-soft:#12403C;
  --g1:#F0935E; --g1-soft:#3D2517; --g3:#8CCB67; --g3-soft:#22331A;
  --ok:#4FC298; --ok-soft:#13372C; --no:#F0806C; --no-soft:#3B1E18; --warn:#E0AC4E; --warn-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#17140F; --surface:#221D16; --surface-2:#2A241C; --line:#3E3528; --line-soft:#322B21;
  --ink:#F1EADF; --ink-2:#CDBFAC; --ink-3:#9D8F7C;
  --accent:#39B3A6; --accent-ink:#06231F; --accent-soft:#12403C;
  --g1:#F0935E; --g1-soft:#3D2517; --g3:#8CCB67; --g3-soft:#22331A;
  --ok:#4FC298; --ok-soft:#13372C; --no:#F0806C; --no-soft:#3B1E18; --warn:#E0AC4E; --warn-soft:#3A2C12;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.78;-webkit-text-size-adjust:100%}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.hidden{display:none!important}

/* 進度軌 */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.topin{display:flex;flex-direction:column;gap:6px;padding-block:8px}
.tprow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.04em}
.crumb{font-family:var(--mono);font-size:13px;color:var(--ink-3);letter-spacing:.04em}
.crumb b{color:var(--ink-2);font-weight:500}
.linkbtn{margin-left:auto;background:none;border:0;color:var(--accent);font-size:14px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.track{display:flex;gap:3px}
.tseg{flex:1;min-width:0;height:29px;border-radius:3px;background:var(--line-soft);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;color:var(--ink-3);position:relative;transition:background .25s,color .25s}
.tseg[data-g="g1"].done{background:var(--g1-soft);color:var(--g1)}
.tseg[data-g="g2"].done{background:var(--accent-soft);color:var(--accent)}
.tseg[data-g="g3"].done{background:var(--g3-soft);color:var(--g3)}
.tseg.done::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;height:2px;border-radius:2px;background:currentColor;opacity:.5}
.tseg.done[data-tries="2"]::after{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)}
.tseg.done[data-tries="3"]::after{background:var(--warn);opacity:1}
.tseg.now{background:var(--ink);color:var(--surface);font-weight:600}
.legend{display:flex;gap:15px;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:22px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}

main{padding-block:18px 116px}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:1fr}}
.grid.solo{grid-template-columns:minmax(0,1fr);max-width:820px;margin-inline:auto}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);position:sticky;top:120px}
@media (max-width:880px){.stage{position:static}.grid .panel{order:-1}}
svg.board{display:block;width:100%;height:auto;max-height:72vh;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:10px}
svg.board text{font-family:var(--sans)}
.boardnote{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-align:center;margin:6px 0 0;letter-spacing:.03em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line-soft)}
.stagehead h2{margin:0 0 2px;font-family:var(--serif);font-size:22px;letter-spacing:.03em;text-wrap:balance}
.phase{font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.phase.g1{background:var(--g1-soft);color:var(--g1)} .phase.g2{background:var(--accent-soft);color:var(--accent)} .phase.g3{background:var(--g3-soft);color:var(--g3)}
.sub{font-size:14.5px;color:var(--ink-3);margin:0}
.qlabel{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-3);margin-bottom:6px}
.q{font-size:19px;font-weight:600;line-height:1.65;margin:0 0 4px;text-wrap:balance}
.qhint{font-size:15.5px;color:var(--ink-2);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 15px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-size:14px;color:var(--ink-3);flex:none;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--no);background:var(--no-soft)}
.opt[disabled]{cursor:default;opacity:.88}
.fb{margin-top:15px;border-radius:10px;padding:14px 17px;font-size:16px;border-left:4px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.no{background:var(--no-soft);border-color:var(--no)}
.fb h4{margin:0 0 6px;font-size:16px;font-family:var(--mono);letter-spacing:.06em}
.fb.ok h4{color:var(--ok)} .fb.no h4{color:var(--no)}
.fb p{margin:0 0 8px} .fb p:last-child{margin-bottom:0}
.tag{display:inline-block;font-family:var(--mono);font-size:12.5px;padding:2px 8px;border-radius:5px;background:var(--warn-soft);color:var(--warn);margin:2px 4px 2px 0}
.refs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
figure{margin:0;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:9px;padding:8px}
figure img{border-radius:5px;background:#fff;width:100%}
figcaption{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:6px;letter-spacing:.02em;line-height:1.5}
.zoomable{cursor:zoom-in}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.barin{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.barmsg{flex:1 1 100%;order:-1;min-width:0;font-size:15px;color:var(--ink-2)}
@media (min-width:620px){.barmsg{flex:1 1 auto;order:0}}
.btn{padding:11px 22px;border-radius:9px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;transition:filter .15s}
.btn:hover{filter:brightness(1.08)} .btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}

/* 開場 */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow);max-width:820px;margin:0 auto}
@media (max-width:600px){.hero{padding:22px 18px}}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5.4vw,40px);margin:0 0 6px;letter-spacing:.03em}
.hero .lede{font-size:17.5px;color:var(--ink-2);margin:0 0 18px}
.heroimg{border-radius:10px;overflow:hidden;border:1px solid var(--line-soft);margin:0 0 18px;background:#fff}
.rules{list-style:none;padding:0;margin:0 0 20px;display:flex;flex-direction:column;gap:10px;font-size:16px}
.rules li{display:flex;gap:10px}
.rules .n{font-family:var(--mono);font-size:12.5px;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;width:25px;height:25px;display:grid;place-items:center;flex:none;margin-top:2px}
.fields{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.field{flex:1;min-width:130px}
.field label{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--ink-3);margin-bottom:4px}
.field input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font:inherit}
.field input:focus{border-color:var(--accent);outline:none}
.herobtns{display:flex;gap:10px;flex-wrap:wrap}

/* 圖解教學 */
.learn{max-width:980px;margin:0 auto}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.lhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.lhead .num{font-family:var(--mono);font-size:13px;color:var(--accent);border:1.5px solid var(--accent);border-radius:6px;padding:0 8px}
.lhead h2{margin:0;font-family:var(--serif);font-size:23px;letter-spacing:.03em}
.lhead .src{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.lbody{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0}
@media (max-width:820px){.lbody{grid-template-columns:1fr}}
.lfig{background:#FFFDF8;padding:16px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px;justify-content:center}
@media (max-width:820px){.lfig{border-right:0;border-bottom:1px solid var(--line-soft)}}
.ltext{padding:18px 20px}
.ltext .quote{border-left:3px solid var(--g1);background:var(--g1-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15.5px;margin:0 0 14px}
.ltext .quote small{display:block;font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:4px}
.ltext ul{margin:0 0 12px;padding-left:1.2em} .ltext li{margin-bottom:6px}
.ltext b.k1{color:var(--g1)} .ltext b.k2{color:var(--accent)} .ltext b.k3{color:var(--g3)}
.lnav{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots button{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:12px;cursor:pointer;color:var(--ink-3)}
.dots button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.replay{align-self:flex-end;background:#fff;border:1.5px solid #CFC3AE;color:#5A4C3C;border-radius:999px;font-size:13px;padding:3px 12px;cursor:pointer}
.lfig .cap{font-family:var(--mono);font-size:12px;color:#877865;text-align:center;line-height:1.5}
/* 動畫舞台 */
.ani{position:relative;width:100%;background:#fff;border-radius:8px;overflow:hidden}
.ani img.base{width:100%}
.pill{position:absolute;transform:translate(-50%,-50%);background:#2A2118;color:#fff;font-size:clamp(11px,1.6vw,15px);font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap;opacity:0}
.pill.c1{background:#C9612A}.pill.c2{background:#0E7C74}.pill.c3{background:#4E8A2E}.pill.c4{background:#6B4FA0}
.ring{position:absolute;width:9%;aspect-ratio:1;border:3px solid #C9612A;border-radius:50%;transform:translate(-50%,-50%);opacity:0}
.play .pill{animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
.play .ring{animation:ring 1.6s ease-out forwards}
@keyframes pop{from{opacity:0;transform:translate(-50%,-30%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.half{position:absolute;left:0;width:100%;height:50%;background-size:100% 200%;background-repeat:no-repeat}
.half.top{top:0;background-position:0 0}.half.bot{bottom:0;background-position:0 100%}
.play .half.top{animation:dropin 1.4s ease-out both}
.play .half.bot{animation:risein 1.4s ease-out both}
@keyframes dropin{from{transform:translateY(-70%);opacity:0}to{transform:none;opacity:1}}
@keyframes risein{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
svg.anim{width:100%;height:auto;display:block}
.play .sol{animation:sol 3.2s ease-in-out .6s infinite}
@keyframes sol{0%{transform:translateY(0);opacity:0}12%{opacity:1}70%{transform:translateY(560px);opacity:1}90%{transform:translateY(700px);opacity:0}100%{transform:translateY(700px);opacity:0}}
.play .lig{animation:lig 2.2s cubic-bezier(.4,0,.2,1) .5s forwards}
@keyframes lig{to{transform:translate(-927px,322px)}}
.play .fadein{animation:fade .6s ease forwards}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fadein{opacity:0}

/* 診斷卡 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:var(--shadow);max-width:900px;margin:0 auto}
@media (max-width:600px){.card{padding:22px 16px}}
.card h1{font-family:var(--serif);font-size:28px;margin:0 0 4px;letter-spacing:.03em}
.who{font-family:var(--mono);font-size:14px;color:var(--ink-2);margin:0 0 18px;letter-spacing:.03em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px}
.stat .v{font-family:var(--mono);font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:13px;color:var(--ink-3);margin-top:2px}
.rows{display:flex;flex-direction:column;gap:5px;margin-bottom:20px}
.row{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;font-size:15.5px;padding:7px 10px;border-radius:7px;background:var(--surface-2)}
.row .i{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.row .m{font-family:var(--mono);font-size:13.5px;letter-spacing:.06em}
.row.t1 .m{color:var(--ok)} .row.t2 .m{color:var(--warn)} .row.t3 .m{color:var(--no)}
.row.t3{background:var(--no-soft)} .row.t2{background:var(--warn-soft)}
h3.sec{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--ink-3);margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.miss{display:flex;flex-direction:column;gap:9px;margin-bottom:20px}
.mi{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;padding:11px 15px;font-size:15.5px}
.mi b{display:block;margin-bottom:2px} .mi span{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.clean{background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;padding:13px 16px;font-size:16px;margin-bottom:20px}

/* 放大檢視 */
.lb{position:fixed;inset:0;background:rgba(20,16,10,.82);z-index:60;display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:min(1200px,100%);max-height:88vh;background:#fff;border-radius:8px}

.piece{cursor:grab}
.piece.sel .hl{opacity:1}
.slotg{cursor:pointer}
.slotg:hover .slot{stroke-width:3;opacity:1!important}
</style>
</head>
<body>

<header class="topbar hidden" id="topbar"><div class="wrap topin">
  <div class="tprow">
    <span class="brand">細胞膜拼裝站</span>
    <span class="crumb" id="crumb"></span>
    <button class="linkbtn" id="to-learn">回圖解教學</button>
  </div>
  <div class="track" id="track"></div>
  <div class="legend">
    <span><i style="background:var(--g1)"></i>認識原料</span>
    <span><i style="background:var(--accent)"></i>組裝細胞膜</span>
    <span><i style="background:var(--g3)"></i>功能與整合</span>
    <span><i style="background:var(--warn)"></i>試了 3 次以上</span>
  </div>
</div></header>

<main class="wrap">
  <section id="intro">
    <div class="hero">
      <h1>細胞膜拼裝站</h1>
      <p class="lede">讀完課本 P18 和細胞膜動畫簡報之後，換你動手把細胞膜「組」出來：挑原料、排磷脂、嵌蛋白質、掛上醣類，最後替整張膜貼上標籤。</p>
      <div class="heroimg" id="heroimg"></div>
      <ul class="rules">
        <li><span class="n">1</span><span>建議先看<b>圖解教學</b>（8 張圖卡，圖片都取自課本與簡報），再進入 <b>11 道關卡</b>。</span></li>
        <li><span class="n">2</span><span>操作題可以<b>用拖的</b>，也可以<b>先點一個零件、再點目標位置</b>；手機上點兩下比較穩。</span></li>
        <li><span class="n">3</span><span>答錯不會擋住你，但每一關試了幾次都會記錄下來，最後變成一張<b>學習診斷卡</b>，請截圖交給老師。</span></li>
      </ul>
      <div class="fields">
        <div class="field"><label for="f-name">姓名</label><input id="f-name" type="text" autocomplete="off" placeholder="王小明"></div>
        <div class="field"><label for="f-cls">班級</label><input id="f-cls" type="text" autocomplete="off" placeholder="103"></div>
        <div class="field"><label for="f-no">座號</label><input id="f-no" type="text" inputmode="numeric" autocomplete="off" placeholder="07"></div>
      </div>
      <div class="herobtns">
        <button class="btn ghost" id="go-learn">先看圖解教學</button>
        <button class="btn" id="go">直接開始闖關</button>
      </div>
    </div>
  </section>

  <section id="learn" class="hidden"><div class="learn">
    <div class="lcard" id="lcard"></div>
    <div class="lnav">
      <button class="btn ghost" id="l-prev">← 上一張</button>
      <div class="dots" id="l-dots"></div>
      <button class="btn" id="l-next">下一張 →</button>
    </div>
  </div></section>

  <section id="play" class="hidden"><div class="grid" id="grid">
    <div class="stage" id="stagecard">
      <svg class="board" id="board" viewBox="0 0 600 530" role="img" aria-label="細胞膜操作區"></svg>
      <p class="boardnote" id="st-note"></p>

<script>
/* ── 迷思概念字典 ── */
const TAGS={
 C1:['細胞膜的組成','把細胞壁的纖維素、儲能的中性脂或 DNA 當成細胞膜的成分。細胞膜主要由磷脂、蛋白質及分布在細胞外側的醣類組成。','課本 P18 圖1-7；簡報 p1'],
 C2:['親水、疏水顛倒','磷脂的頭部（甘油＋含磷酸成分的基團）是親水性，尾部（兩條脂肪酸）是疏水性。','課本 P15；簡報 p2'],
 C3:['磷脂 vs. 中性脂','磷脂＝甘油＋磷酸成分＋2 條脂肪酸，是膜狀構造的主要成分；中性脂＝甘油＋3 條脂肪酸，是儲存能量的形式。','課本 P15 脂質'],
 C4:['脂雙層的方向','兩層磷脂的疏水尾部彼此相對、藏在膜的中間；親水頭部朝外，面對細胞外與細胞內的水環境。','簡報 p3'],
 C5:['蛋白質在膜上的位置','膜蛋白鑲嵌在脂雙層上，運輸蛋白更是貫穿整層膜，才能當物質進出的管道。','課本 P18；簡報 p5'],
 C6:['醣類只在細胞外側','醣類附著在細胞膜「外側」，常與蛋白質結合成醣蛋白；膜的內側與中間都沒有。','課本 P18；簡報 p8'],
 C7:['膜蛋白的功能','醣蛋白：辨識細胞種類的標記；運輸蛋白：特定物質進出的管道；受體：對外的接受器；酵素：催化反應（有些受體具酵素功能）。','簡報 p4–p6'],
 C8:['選擇性通透','細胞膜既不是全擋、也不是全放行，而是調節物質進出，以維持細胞內在環境的穩定。','課本 P18；簡報 p7'],
 C9:['細胞膜的尺度','細胞膜厚度只有數奈米（1～10 nm 之間），光學顯微鏡看不到它的構造，需用電子顯微鏡。','課本 P13 圖1-4'],
 C10:['分不清細胞內、外','有醣類的那一側就是細胞外。','課本 P18 圖1-7'],
 C11:['細胞膜 vs. 細胞壁','所有活細胞都有細胞膜；植物細胞是在細胞膜「外面」再多一層細胞壁，並不是用細胞壁取代細胞膜。','課本 P16–P17']
};

 txt:`<p class="quote">細胞膜存在於活細胞，可用來區隔細胞內部與胞外環境，主要由<b>磷脂、蛋白質</b>及分布在<b>細胞外側的醣類</b>所組成。<small>課本 P18</small></p>

 txt:`<p class="quote">構成生物體較重要的脂質是磷脂與中性脂。磷脂含有脂肪酸、甘油及磷酸等，是細胞中膜狀物的主要成分。中性脂含有脂肪酸與甘油，是生物體儲存能量的主要形式。<small>課本 P15</small></p>
 <ul><li><b class="k1">頭部</b>（甘油＋含磷酸成分的基團）→ <b>親水性</b>，喜歡靠近水。</li>

 txt:`<p class="quote">磷脂 ① 排列成雙層結構，稱為<b>脂雙層</b>；② 區隔細胞內部與胞外環境。<small>簡報 p3</small></p>

let LI=0;
function showLearn(i){
  LI=i;const L=LEARN[i];
  el('lcard').innerHTML=`<div class="lhead"><span class="num">${String(i+1).padStart(2,'0')} / ${LEARN.length}</span><h2>${L.t}</h2><span class="src">${L.src}</span></div>
   <div class="lbody"><div class="lfig">${L.fig()}</div><div class="ltext">${L.txt}</div></div>`;
  el('l-dots').innerHTML=LEARN.map((x,j)=>`<button class="${j===i?'on':''}" data-j="${j}" aria-label="第 ${j+1} 張：${x.t}">${j+1}</button>`).join('');
  el('l-dots').querySelectorAll('button').forEach(b=>b.onclick=()=>showLearn(+b.dataset.j));
  el('l-prev').disabled=i===0;
  el('l-next').textContent=i===LEARN.length-1?'開始闖關 →':'下一張 →';
  const a=el('ani');if(a)requestAnimationFrame(()=>a.classList.add('play'));
  el('lcard').querySelectorAll('.replay').forEach(b=>b.onclick=()=>{const a=el('ani');a.classList.remove('play');void a.offsetWidth;a.classList.add('play')});
  bindZoom(el('lcard'));
  window.scrollTo({top:0,behavior:'smooth'});
}
function bindZoom(root){root.querySelectorAll('img.zoomable').forEach(i=>i.onclick=()=>{
  const d=document.createElement('div');d.className='lb';d.innerHTML=`<img src="${i.src}" alt="${i.alt}">`;d.onclick=()=>d.remove();document.body.appendChild(d);});}
</script>

<script>
const el=id=>document.getElementById(id);
const KEY='membranegame.v2';
let ST={idx:0,tries:{},tags:{},who:{n:'',c:'',s:''},t0:0,done:false};
let place={},sel=null,answered=false,pick=new Set(),order=[],layout={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}

/* ── 進度軌 ── */
function drawTrack(){
  el('track').innerHTML=STAGES.map((s,i)=>{const t=ST.tries[i],cls=i===ST.idx&&!ST.done?'now':(t!=null&&ST.passed&&ST.passed[i]?'done':'');
    return `<div class="tseg ${cls}" data-g="${s.g}" data-tries="${t==null?'':Math.min(t,3)}" title="${s.t}">${i+1}</div>`}).join('');
  const s=STAGES[ST.idx],gn={g1:'認識原料',g2:'組裝細胞膜',g3:'功能與整合'}[s.g];
  el('crumb').innerHTML=`${gn} <b>·</b> ${s.t} <b>·</b> ${ST.idx+1} / ${STAGES.length}`;
}

/* ── 操作板 ── */
function trayLayout(s){
  const ts=s.ts||1,W=600,pad=12,gap=10;let rows=[[]],rw=0;
  order.forEach(p=>{const w=p.w*(p.label?1:ts);if(rw+w+gap>W-pad*2&&rows[rows.length-1].length){rows.push([]);rw=0}rows[rows.length-1].push(p);rw+=w+gap});
  let y=s.sceneH+38;const L={};
  rows.forEach(r=>{const rh=Math.max(...r.map(p=>p.h*(p.label?1:ts)));const tw=r.reduce((a,p)=>a+p.w*(p.label?1:ts),0)+gap*(r.length-1);
    let x=(W-tw)/2;r.forEach(p=>{const w=p.w*(p.label?1:ts);L[p.id]={x:x+w/2,y:y+rh/2,s:p.label?1:ts};x+=w+gap});y+=rh+12});
  return{L,H:y+4};
}
function pieceSVG(p){
  if(p.label)return `<rect class="hl" x="${-p.w/2-5}" y="${-p.h/2-5}" width="${p.w+10}" height="${p.h+10}" rx="12" fill="none" stroke="${TEAL}" stroke-width="3" opacity="0"/>
    <rect x="${-p.w/2}" y="${-p.h/2}" width="${p.w}" height="${p.h}" rx="8" fill="#fff" stroke="${INK}" stroke-width="1.6"/>
    <text y="6" text-anchor="middle" font-size="${p.label.length>7?15:17}" font-weight="600" fill="${INK}">${p.label}</text>`;
  return `<rect class="hl" x="${-p.w/2-5}" y="${-p.h/2-5}" width="${p.w+10}" height="${p.h+10}" rx="10" fill="${TEAL}" fill-opacity=".12" stroke="${TEAL}" stroke-width="2.5" opacity="0"/>
    <rect x="${-p.w/2}" y="${-p.h/2}" width="${p.w}" height="${p.h}" fill="transparent"/>
    <g class="gl">${im(p.img,-p.w/2,-p.h/2,p.w,p.h)}</g>`;
}
function renderBoard(s){
  if(s.kind!=='drag'){el('stagecard').classList.add('hidden');el('grid').classList.add('solo');return;}
  el('stagecard').classList.remove('hidden');el('grid').classList.remove('solo');
  SLOTG=Object.fromEntries(s.slots.map(x=>[x.id,x.group]));
  order=s.pieces.slice();
  if(s.shuffle){let seed=ST.idx*7+3;order.sort((a,b)=>{seed=(seed*9301+49297)%233280;return seed/233280-.5})}
  const TL=trayLayout(s);layout=TL.L;
  const b=el('board');b.setAttribute('viewBox',`0 0 600 ${TL.H}`);
  let o=s.scene();
  o+=s.slots.map(x=>`<g class="slotg" data-slot="${x.id}"><rect class="slot" x="${x.x-x.w/2}" y="${x.y-x.h/2}" width="${x.w}" height="${x.h}" rx="8" fill="#FFFFFF" fill-opacity=".55" stroke="${TEAL}" stroke-width="2" stroke-dasharray="6 5" opacity=".85"/>`
    +(x.cap?txt(x.x-x.w/2+2,x.y-x.h/2-5,x.cap,{a:'start',fs:12.5,fw:500,c:'#5A4C3C'}):'')+`</g>`).join('');
  o+=`<rect x="4" y="${s.sceneH+6}" width="592" height="${TL.H-s.sceneH-10}" rx="12" fill="#F1ECE2" stroke="#D8CEBC" stroke-width="1.5"/>`
    +txt(18,s.sceneH+28,'托盤　TRAY',{a:'start',fs:13,fw:500,c:'#877865',x:'letter-spacing="2"'});
  o+=order.map((p,i)=>`<g class="piece" data-piece="${p.id}" tabindex="0" role="button" aria-label="零件 ${p.label||(i+1)}">${pieceSVG(p)}</g>`).join('');
  b.innerHTML=o;el('st-note').textContent=s.note||'';
  syncBoard();
  b.querySelectorAll('.slotg').forEach(g=>g.addEventListener('click',()=>{
    if(answered||!sel)return;const id=g.dataset.slot;if(place[id])return;
    for(const k in place)if(place[k]===sel)delete place[k];place[id]=sel;sel=null;syncBoard();}));
}
function syncBoard(){
  const s=STAGES[ST.idx];if(s.kind!=='drag')return;
  const inv={};for(const k in place)inv[place[k]]=k;
  const keep=order;order=order.filter(p=>!inv[p.id]);layout=Object.assign({},layout,trayLayout(s).L);order=keep;
  order.forEach(p=>{const g=el('board').querySelector(`[data-piece="${p.id}"]`);if(!g)return;
    const sl=inv[p.id]?s.slots.find(x=>x.id===inv[p.id]):null;
    const h=sl?{x:sl.x,y:sl.y,s:1}:layout[p.id];
    const flip=(p.flip?-1:1)*(sl&&sl.group==='in'&&p.img&&p.img.startsWith('sugar')?-1:1);
    g.setAttribute('transform',`translate(${h.x},${h.y}) scale(${h.s},${h.s*flip})`);
    g.classList.toggle('sel',sel===p.id);});
  s.slots.forEach(x=>{const r=el('board').querySelector(`.slotg[data-slot="${x.id}"] .slot`);if(r)r.setAttribute('opacity',place[x.id]?'0':'.85')});
  el('barmsg').textContent=answered?el('barmsg').textContent:`已放置 ${Object.keys(place).length} / ${s.slots.length} 格`+(sel?'　·　已選取一個零件，點目標位置放下':'');
}
function svgPt(e){const b=el('board'),p=b.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(b.getScreenCTM().inverse())}
let drag=null;
function onDown(e){
  if(answered)return;const g=e.target.closest('.piece');if(!g)return;e.preventDefault();
  const p=svgPt(e),m=/translate\(([-\d.]+),([-\d.]+)\) scale\(([-\d.]+),([-\d.]+)\)/.exec(g.getAttribute('transform'));
  drag={g,id:g.dataset.piece,dx:p.x-(+m[1]),dy:p.y-(+m[2]),x0:+m[1],y0:+m[2],sc:`scale(${m[3]},${m[4]})`,moved:false};
  g.parentNode.appendChild(g);g.setPointerCapture&&g.setPointerCapture(e.pointerId);g.style.cursor='grabbing';
}
function onMove(e){if(!drag)return;const p=svgPt(e),nx=p.x-drag.dx,ny=p.y-drag.dy;
  if(!drag.moved&&Math.hypot(nx-drag.x0,ny-drag.y0)<5)return;drag.moved=true;
  drag.g.setAttribute('transform',`translate(${nx},${ny}) ${drag.sc}`);}
function onUp(e){
  if(!drag)return;const d=drag;drag=null;d.g.style.cursor='';
  const s=STAGES[ST.idx],p=svgPt(e);
  if(!d.moved){sel=(sel===d.id?null:d.id);syncBoard();return;}
  let best=null,bd=1e9;
  s.slots.forEach(x=>{if(place[x.id]&&place[x.id]!==d.id)return;const dd=Math.hypot(x.x-p.x,x.y-p.y);if(dd<bd){bd=dd;best=x}});
  for(const k in place)if(place[k]===d.id)delete place[k];
  if(best&&bd<Math.max(best.w,best.h)/2+34)place[best.id]=d.id;
  sel=null;syncBoard();
}

/* ── 題目面板 ── */
function refHTML(list){return `<div class="refs">${list.map(r=>`<figure><img src="${IMG[r.src]}" alt="${r.cap}" loading="lazy" class="zoomable"><figcaption>${r.cap}</figcaption></figure>`).join('')}</div>`}
function renderPanel(s){
  el('st-title').textContent=s.t;el('st-sub').textContent=s.sub;
  const ph=el('st-phase');ph.className='phase '+s.g;ph.textContent={g1:'認識原料',g2:'組裝細胞膜',g3:'功能與整合'}[s.g];
  el('q-label').textContent=s.kind==='drag'?'操作任務':(s.kind==='multi'?'觀念題 · 多選':'觀念題 · 單選');
  el('q-text').textContent=s.q;el('q-hint').textContent=s.hint||'';
  const o=el('q-opts');
  let perm=s.opts?s.opts.map((x,i)=>i):[];
  for(let i=perm.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}
  o.innerHTML=s.kind==='drag'?'':perm.map((i,pos)=>`<li><button class="opt" data-i="${i}"><span class="k">${'ABCDEF'[pos]}</span><span>${s.opts[i].t}</span></button></li>`).join('');
  o.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
    if(answered)return;const i=+b.dataset.i;
    if(s.kind==='single'){pick.clear();pick.add(i)}else{pick.has(i)?pick.delete(i):pick.add(i)}
    o.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',pick.has(+x.dataset.i)));
    el('barmsg').textContent=pick.size?`已選 ${pick.size} 項`:'';}));
  el('q-fb').innerHTML=s.preRefs?refHTML(s.preRefs):'';bindZoom(el('q-fb'));
}
function show(i){
  ST.idx=i;place={};sel=null;pick.clear();answered=false;const s=STAGES[i];
  el('check-btn').classList.remove('hidden');el('next-btn').classList.add('hidden');
  el('reset-btn').classList.toggle('hidden',s.kind!=='drag');el('barmsg').textContent='';
  renderPanel(s);renderBoard(s);drawTrack();save();window.scrollTo({top:0,behavior:'smooth'});
}
function addTags(t){(t||[]).forEach(x=>{ST.tags[x]=(ST.tags[x]||0)+1})}
function check(){
  const s=STAGES[ST.idx];if(answered)return;let r;
  if(s.kind==='drag'){const m={};s.slots.forEach(x=>{m[x.id]=place[x.id]?s.pieces.find(p=>p.id===place[x.id]):null});r=s.check(m);}
  else{const right=new Set(s.opts.map((x,i)=>x.ok?i:-1).filter(i=>i>=0));
    if(!pick.size){el('barmsg').textContent='先選答案。';return;}
    const ok=pick.size===right.size&&[...pick].every(i=>right.has(i));
    const tags=[...pick].filter(i=>!s.opts[i].ok).map(i=>s.opts[i].tag).filter(Boolean);
    const miss=[...right].filter(i=>!pick.has(i)).length;
    r=ok?{ok:true}:{ok:false,msg:tags.length?'有選項選錯了，看看下面標出的觀念。':(miss?`還少選了 ${miss} 項。`:'再想一次。'),tags};
    document.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;if(pick.has(i))b.classList.add(s.opts[i].ok?'right':'wrong')});
    if(!ok)setTimeout(()=>document.querySelectorAll('.opt').forEach(b=>b.classList.remove('wrong','right')),1400);}
  ST.tries[ST.idx]=(ST.tries[ST.idx]||0)+1;
  if(r.ok){answered=true;ST.passed=ST.passed||{};ST.passed[ST.idx]=true;
    el('q-fb').innerHTML=`<div class="fb ok"><h4>✓ 正確</h4><p>${s.why}</p></div>`+refHTML(s.refs);bindZoom(el('q-fb'));
    el('check-btn').classList.add('hidden');el('next-btn').classList.remove('hidden');
    el('next-btn').textContent=ST.idx===STAGES.length-1?'看我的診斷卡 →':'下一步 →';
    el('barmsg').textContent=`第 ${ST.idx+1} 關過關　·　共嘗試 ${ST.tries[ST.idx]} 次`;
    document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(s.opts&&s.opts[+b.dataset.i].ok)b.classList.add('right')});
  }else{addTags(r.tags);
    const tg=(r.tags||[]).map(t=>`<span class="tag">${TAGS[t][0]}</span>`).join('');
    el('q-fb').innerHTML=`<div class="fb no"><h4>再試一次</h4><p>${r.msg||'還沒對。'}</p>${tg?`<p>${tg}</p>`:''}</div>`+(s.preRefs?refHTML(s.preRefs):'');bindZoom(el('q-fb'));
    el('barmsg').textContent=`已嘗試 ${ST.tries[ST.idx]} 次`;}
  drawTrack();save();
}
/* ── 診斷卡 ── */
function finish(){
  ST.done=true;save();
  ['play','bar'].forEach(x=>el(x).classList.add('hidden'));
  const mins=Math.max(1,Math.round((Date.now()-ST.t0)/60000)),tr=STAGES.map((s,i)=>ST.tries[i]||0);
  const one=tr.filter(t=>t===1).length,two=tr.filter(t=>t===2).length,hard=tr.filter(t=>t>=3).length,w=ST.who;
  const rows=STAGES.map((s,i)=>{const t=tr[i],c=t>=3?'t3':t===2?'t2':'t1';return `<div class="row ${c}"><span class="i">${String(i+1).padStart(2,'0')}</span><span>${s.t}</span><span class="m">${t} 次</span></div>`}).join('');
  const mk=Object.keys(ST.tags).sort((a,b)=>ST.tags[b]-ST.tags[a]);
  const miss=mk.length?mk.map(k=>`<div class="mi"><b>${TAGS[k][0]}　<span>觸發 ${ST.tags[k]} 次</span></b>${TAGS[k][1]}<br><span>回頭看：${TAGS[k][2]}</span></div>`).join('')
    :`<div class="clean">沒有觸發任何迷思概念——十一關的每一個判斷都一次到位。</div>`;
  el('done').innerHTML=`<div class="card"><h1>細胞膜　學習診斷卡</h1>
    <p class="who">${w.n||'（未填姓名）'}　|　${w.c||'—'} 班　${w.s?'座號 '+w.s:''}　|　${new Date().toLocaleDateString('zh-TW')}　|　用時約 ${mins} 分鐘</p>
    <div class="stats"><div class="stat"><div class="v" style="color:var(--ok)">${one}</div><div class="l">一次過關</div></div>
      <div class="stat"><div class="v" style="color:var(--warn)">${two}</div><div class="l">試了 2 次</div></div>
      <div class="stat"><div class="v" style="color:var(--no)">${hard}</div><div class="l">試了 3 次以上</div></div>
      <div class="stat"><div class="v">${tr.reduce((a,b)=>a+b,0)}</div><div class="l">總作答次數</div></div></div>
    <h3 class="sec">逐關紀錄</h3><div class="rows">${rows}</div>
    <h3 class="sec">需要回頭補的觀念</h3><div class="miss">${miss}</div>
    <div class="barin" style="padding:0"><span class="barmsg">把這張卡截圖，上傳給老師。</span>
      <button class="btn ghost" id="relearn">回圖解教學</button><button class="btn" id="again">再玩一次</button></div></div>`;
  el('done').classList.remove('hidden');drawTrack();
  el('again').onclick=()=>{ST={idx:0,tries:{},tags:{},passed:{},who:ST.who,t0:Date.now(),done:false};el('done').classList.add('hidden');startPlay();};
  el('relearn').onclick=()=>{el('done').classList.add('hidden');openLearn(0)};
  window.scrollTo({top:0,behavior:'smooth'});
}
/* ── 畫面切換 ── */
function grabWho(){ST.who={n:el('f-name').value.trim(),c:el('f-cls').value.trim(),s:el('f-no').value.trim()};save();}
function openLearn(i){['intro','play','bar','done'].forEach(x=>el(x).classList.add('hidden'));el('topbar').classList.add('hidden');el('learn').classList.remove('hidden');showLearn(i||0);}
function startPlay(){
  if(!ST.t0)ST.t0=Date.now();
  ['intro','learn','done'].forEach(x=>el(x).classList.add('hidden'));
  ['play','topbar','bar'].forEach(x=>el(x).classList.remove('hidden'));
  if(ST.done){ST={idx:0,tries:{},tags:{},passed:{},who:ST.who,t0:Date.now(),done:false}}
  show(ST.idx||0);
}
el('go').onclick=()=>{grabWho();startPlay()};
el('go-learn').onclick=()=>{grabWho();openLearn(0)};
el('to-learn').onclick=()=>openLearn(0);
el('l-prev').onclick=()=>LI>0&&showLearn(LI-1);
el('l-next').onclick=()=>LI<LEARN.length-1?showLearn(LI+1):startPlay();
el('check-btn').onclick=check;
el('reset-btn').onclick=()=>{if(answered)return;place={};sel=null;syncBoard();el('q-fb').innerHTML='';};
el('next-btn').onclick=()=>ST.idx+1<STAGES.length?show(ST.idx+1):finish();
const B=el('board');
B.addEventListener('pointerdown',onDown);B.addEventListener('pointermove',onMove);B.addEventListener('pointerup',onUp);B.addEventListener('pointercancel',onUp);
B.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('.piece');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sel=(sel===g.dataset.piece?null:g.dataset.piece);syncBoard();}});
el('heroimg').innerHTML=`<img src="${IMG.tb_mem_lab}" alt="課本 P18 圖1-7 細胞膜示意圖">`;
(function boot(){
  const saved=load();
  if(saved&&!saved.done&&(saved.idx>0||Object.keys(saved.tries||{}).length)){
    ST=Object.assign(ST,saved);el('f-name').value=ST.who.n||'';el('f-cls').value=ST.who.c||'';el('f-no').value=ST.who.s||'';
    el('go').textContent=`繼續闖關（第 ${ST.idx+1} 關）`;}
})();
</script>
</body></html>
